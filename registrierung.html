<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrierung – Falkenstein Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <main>
        <h1>Falkenstein Portal</h1>
        <h2>Registrierung</h2>

        <form id="registerForm">

            <label for="email">E-Mail</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >

            <label for="password">Passwort</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="new-password"
            >

            <label for="passwordConfirm">Passwort wiederholen</label>
            <input
                type="password"
                id="passwordConfirm"
                required
                autocomplete="new-password"
            >

            <label for="minecraftName">Minecraft-Name</label>
            <input
                type="text"
                id="minecraftName"
                required
            >

            <label for="discordName">Discord-Name</label>
            <input
                type="text"
                id="discordName"
                required
            >

            <button type="submit">
                Registrieren
            </button>

        </form>

        <p id="message"></p>

        <p>
            Bereits registriert?
            <a href="anmeldung.html">Jetzt anmelden</a>
        </p>
    </main>

    <script src="js/auth.js"></script>

</body>
</html>
